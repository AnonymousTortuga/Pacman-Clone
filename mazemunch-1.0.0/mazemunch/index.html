<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0820" />
    <meta name="description" content="Mazemunch: a maze-chase arcade game that runs in your browser." />
    <title>Mazemunch</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="src/main.js"></script>
  </head>
  <body>
    <main id="stage">
      <canvas id="game" width="224" height="288" aria-label="Mazemunch game. Use the arrow keys or swipe to move, P to pause, Enter to start."></canvas>
      <div id="ui"></div>
      <div id="boot" role="status" aria-live="polite">
        <p>Loading Mazemunch</p>
        <div class="bar"><div id="boot-bar"></div></div>
      </div>
      <noscript>Mazemunch needs JavaScript turned on to play.</noscript>
    </main>
  </body>
</html>
